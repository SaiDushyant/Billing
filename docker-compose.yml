services:
  postgres:
    image: postgres:16
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: s1a2i3$$
      POSTGRES_DB: billing_software

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    ports:
      - "4000:4000"

    environment:
      DATABASE_URL: postgresql://postgres:s1a2i3$$@postgres:5432/billing_software

    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    ports:
      - "5173:5173"

    depends_on:
      - api

volumes:
  postgres_data:
